<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lizura Games</title>
<meta name="description" content="Lizura Games — a small independent game studio based in Poland, making casual word and puzzle games.">
<style>
  :root { color-scheme: light dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
    color: #1c1c1e;
    background: #faf9f7;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  main {
    flex: 1;
    max-width: 40rem;
    margin: 0 auto;
    padding: 4rem 1.5rem 2rem;
  }
  h1 {
    font-size: 2rem;
    letter-spacing: -0.02em;
    margin-bottom: 1.5rem;
  }
  h1 em { font-style: normal; opacity: 0.55; }
  p { margin-bottom: 1rem; }
  a { color: inherit; }
  .contact { margin-top: 2rem; }
  footer {
    max-width: 40rem;
    margin: 0 auto;
    width: 100%;
    padding: 1.5rem;
    font-size: 0.85rem;
    opacity: 0.65;
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #e8e6e3; background: #141414; }
  }
</style>
</head>
<body>
<main>
  <h1>Lizura<em> Games</em></h1>
  <p>A small independent game studio, making casual games.</p>
  <p>Our first title, <strong>Croxel</strong> – a word puzzle game – is coming to Google Play.</p>
  <p class="contact">Contact: <a href="mailto:lizuragames+support@gmail.com">lizuragames+support@gmail.com</a></p>

<footer>

  <a href="privacy.html">Privacy Policy</a>
</footer>
